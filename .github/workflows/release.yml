name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libx11-dev libxext-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev \
            libxft-dev libfontconfig1-dev \
            libpango1.0-dev libcairo2-dev libglib2.0-dev
      - name: Build release binary
        run: cargo build --release
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BINARY="xfce-aero-lang-changer-${{ matrix.target }}"
          cp target/release/xfce-aero-lang-changer "$BINARY"
          gh release upload "${{ github.event.release.tag_name }}" "$BINARY" --clobber
