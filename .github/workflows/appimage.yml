name: Build AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0.6)"
        required: true
      description:
        description: "Release notes"
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            arch: aarch64
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: pkgforge-dev/anylinux-setup-action@v2
      - name: Make AppImage
        run: /bin/sh ./appimage/make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "TAG=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.tag.outputs.TAG }}" &>/dev/null \
            || gh release create "${{ steps.tag.outputs.TAG }}" \
              --title "${{ steps.tag.outputs.TAG }}" \
              --notes "${{ github.event.inputs.description }}" \
              --generate-notes

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in *.AppImage *.AppImage.zsync; do
            [ -f "$f" ] && gh release upload "${{ steps.tag.outputs.TAG }}" "$f" --clobber
          done
