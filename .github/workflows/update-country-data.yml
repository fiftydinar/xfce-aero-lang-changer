name: Monthly country data update

on:
  schedule:
    # 1st of every month at 10:00 UTC
    - cron: "0 10 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git python 2>&1 | tail -5

      - uses: actions/checkout@v4

      - name: Generate all UTF-8 locales
        run: |
          sed -i 's/^#\([a-z].*UTF-8\)/\1/' /etc/locale.gen
          locale-gen 2>&1 | tail -3

      - name: Show installed locales count
        run: locale -a | grep -c ".utf8"

      - name: Generate country data
        run: python3 scripts/generate-country-data.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: diff
        run: |
          if ! git diff --quiet data/country_names.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "diff_size=$(git diff data/country_names.json | wc -l)" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update country_names.json from latest CLDR + system data"
          title: "Update country data (${{ steps.diff.outputs.diff_size }} lines changed)"
          body: |
            Automated update of `data/country_names.json` from:
            - Latest CLDR release (territory translations)
            - System locale LC_ADDRESS extraction from Arch Linux
            - Manual overrides for CLDR fallback cases

            **Changes:** ${{ steps.diff.outputs.diff_size }} lines modified.
          branch: automated/update-country-data
          base: main
          labels: automated, country-data
